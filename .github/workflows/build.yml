name: build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          source /opt/rh/gcc-toolset-14/enable
          pipx install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_ARM_SUPPORT=ON -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc -s"

      - name: Build
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsdecomp-toolkit-linux-x86_64
          path: build/bin/3dsdecomp-toolkit
          if-no-files-found: error

  windows-x86_64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >-
          clang-cl --version &&
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_ARM_SUPPORT=ON
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBUILD_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsdecomp-toolkit-windows-x86_64
          path: build/bin/3dsdecomp-toolkit.exe
          if-no-files-found: error

  release:
    needs: [linux-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up date-based tag
        run: echo "TAG_NAME=v$(date +'%Y%m%d.%H%M')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${GITHUB_SHA::5}
          target_commitish: ${{ github.sha }}
          body: "Automated release of ${{ github.ref_name }}."
          generate_release_notes: true
          files: |
            3dsdecomp-toolkit-linux-x86_64/3dsdecomp-toolkit
            3dsdecomp-toolkit-windows-x86_64/3dsdecomp-toolkit.exe

